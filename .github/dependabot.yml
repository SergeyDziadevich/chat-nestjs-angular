version: 2
updates:
  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for NestJS API service
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Angular Frontend service
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Playwright E2E tests
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"

  # Maintain Dockerfile base images for API service
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"

  # Maintain Dockerfile base images for Frontend service
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Maintain Docker Compose images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
